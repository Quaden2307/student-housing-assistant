[project]
name = "student-housing-assistant"
version = "0.1.0"
description = "Fair-price check for Waterloo student rentals: a model trained on scraped Kitchener-Waterloo listings scores one listing's asking price."
readme = "README.md"
authors = [
    { name = "Caden Sun", email = "cadensun07@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import package is ``housing`` (src/housing), not the project name.
module-name = "housing"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, D pydocstyle, SIM simplify.
# D enforces the "docstrings on public functions" convention from CLAUDE.md.
select = ["E", "W", "F", "I", "B", "UP", "D", "SIM"]
ignore = [
    "D100", # module docstring not required
    "D104", # package docstring not required
    "D105", # magic method docstring not required
    "D107", # __init__ docstring not required
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]
"scripts/field_audit.py" = ["E501"]  # Markdown prose

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
